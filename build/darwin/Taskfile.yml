version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Build a universal macOS executable
    deps:
      - task: common:tidy
      - task: common:generate:icons
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0" MACOSX_DEPLOYMENT_TARGET=12.0 go build -tags production -trimpath -buildvcs=false -ldflags="-s -w" -o "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" ./cmd/desktop
      - CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0" MACOSX_DEPLOYMENT_TARGET=12.0 go build -tags production -trimpath -buildvcs=false -ldflags="-s -w" -o "{{.BIN_DIR}}/{{.APP_NAME}}-arm64" ./cmd/desktop
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  run:
    summary: Run the macOS desktop application
    deps: [build]
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'

  package:
    summary: Build the macOS app and DMG
    cmds:
      - task: create:app
      - task: create:dmg

  create:app:
    summary: Create the .app bundle with an ad-hoc signature
    deps: [build]
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/icons.icns"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  create:dmg:
    summary: Create a distributable DMG
    deps: [create:app]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        --background build/darwin/dmg-background.png
        --volume-icon build/darwin/icons.icns
        --file-icon build/darwin/dmg-file-icon.icns
        --window-width 540 --window-height 380
