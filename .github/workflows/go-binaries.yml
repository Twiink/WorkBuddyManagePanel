name: go-binaries

# 测试、桌面安装包与无界面服务端产物均使用原生 runner 构建：
#   - PR / push main → 测试 + Linux/Windows/macOS 桌面安装包 + 服务端二进制
#   - push v* tag    → 同一套构建 + 汇总 checksums + 创建 GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "build/**"
      - "Taskfile.yml"
      - "config.example.json"
      - "README.md"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the GitHub Release for a v* tag ref"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release source tag, for example v1.14.0 (leave empty for branch builds)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0
  APP_NAME: workbuddy-manage-panel

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebView headers
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::ForceIPv4=true \
              update; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd/desktop cmd/server internal/gateway internal/buildinfo)"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

  read-version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Read build version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/buildinfo/version.go)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::cannot read Version from internal/buildinfo/version.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION"

  desktop-linux:
    needs: read-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native desktop dependencies
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::ForceIPv4=true \
              update; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libfuse2 python3-pil
      - name: Install Wails v3
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build .deb and AppImage
        run: |
          export PATH="${HOME}/go/bin:${PATH}"
          wails3 task linux:package
      - name: Name release files
        run: |
          V="${{ needs.read-version.outputs.version }}"
          V="${V%-panel}"
          mkdir -p release
          cp bin/workbuddy-manage-panel.deb "release/workbuddy-manage-panel_${V}_amd64.deb"
          for f in bin/*.AppImage; do
            cp "$f" "release/workbuddy-manage-panel-${V}-linux-amd64.AppImage"
          done
          test -s "release/workbuddy-manage-panel_${V}_amd64.deb"
          test -s "release/workbuddy-manage-panel-${V}-linux-amd64.AppImage"
          file release/*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release/*
          retention-days: 7

  desktop-windows:
    needs: read-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails v3 and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
          choco install nsis --yes --no-progress
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build NSIS installer
        shell: pwsh
        run: wails3 task windows:package
      - name: Name release file
        shell: pwsh
        run: |
          $version = "${{ needs.read-version.outputs.version }}".Replace("-panel", "")
          New-Item -ItemType Directory release -Force | Out-Null
          $installer = Get-ChildItem -Path bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $output = "release\workbuddy-manage-panel-${version}-windows-amd64-setup.exe"
          Copy-Item $installer.FullName $output
          if ((Get-Item $output).Length -le 0) { throw "Empty installer: $output" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release/*
          retention-days: 7

  desktop-macos:
    needs: read-version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails v3
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build universal .app and DMG
        run: wails3 task darwin:package
      - name: Name release files
        run: |
          V="${{ needs.read-version.outputs.version }}"
          V="${V%-panel}"
          mkdir -p release
          DMG="$(find bin -maxdepth 1 -type f -name '*.dmg' | head -1)"
          if [[ -z "$DMG" ]]; then
            echo "::error::DMG not found"
            exit 1
          fi
          cp "$DMG" "release/workbuddy-manage-panel-${V}-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            bin/workbuddy-manage-panel.app \
            "release/workbuddy-manage-panel-${V}-macos-universal.zip"
          lipo -archs bin/workbuddy-manage-panel.app/Contents/MacOS/workbuddy-manage-panel
          codesign --verify --deep --strict bin/workbuddy-manage-panel.app
          test -s "release/workbuddy-manage-panel-${V}-macos-universal.dmg"
          test -s "release/workbuddy-manage-panel-${V}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release/*
          retention-days: 7

  server-binaries:
    needs: read-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: zip }
          - { goos: linux, goarch: amd64, ext: tar.gz }
          - { goos: linux, goarch: arm64, ext: tar.gz }
          - { goos: darwin, goarch: amd64, ext: tar.gz }
          - { goos: darwin, goarch: arm64, ext: tar.gz }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          BIN="wb2api"
          [[ "$GOOS" == windows ]] && BIN+=".exe"
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$BIN" ./cmd/server
          VERSION="${VERSION%-panel}"
          grep -aq "$VERSION" "$BIN"
          NAME="wb2api-panel-${VERSION}-${GOOS}-${GOARCH}.${{ matrix.ext }}"
          if [[ "$GOOS" == windows ]]; then
            zip -q "$NAME" "$BIN" config.example.json README.md
          else
            tar czf "$NAME" "$BIN" config.example.json README.md
          fi
          mkdir -p release
          mv "$NAME" release/
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          retention-days: 7

  publish:
    needs:
      - read-version
      - desktop-linux
      - desktop-windows
      - desktop-macos
      - server-binaries
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish &&
        (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag matches source version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          SRC="${{ needs.read-version.outputs.version }}"
          SRC="${SRC%-panel}"
          TAG="$RELEASE_TAG"
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          if [[ "$TAG" != *-ci ]]; then
            TAG="${TAG#v}"
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $RELEASE_TAG does not match source version $SRC"
              exit 1
            fi
          else
            echo "CI-only tag $RELEASE_TAG skips the release-version assertion"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify expected assets
        shell: bash
        run: |
          count_deb="$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)"
          count_appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          count_windows="$(find dist -maxdepth 1 -type f -name '*-windows-amd64-setup.exe' | wc -l)"
          count_dmg="$(find dist -maxdepth 1 -type f -name '*-macos-universal.dmg' | wc -l)"
          count_macos_zip="$(find dist -maxdepth 1 -type f -name '*-macos-universal.zip' | wc -l)"
          if (( count_deb != 1 || count_appimage != 1 || count_windows != 1 || count_dmg != 1 || count_macos_zip != 1 )); then
            find dist -maxdepth 1 -type f -printf '%f\n' | sort
            echo "::error::desktop release assets are incomplete"
            exit 1
          fi
      - name: Create checksums
        run: |
          cd dist
          mapfile -t assets < <(
            find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' |
              sort
          )
          printf 'Created checksums.txt\n'
          sha256sum "${assets[@]}" | tee checksums.txt
          sha256sum --check checksums.txt
      - name: Find previous release tag
        id: prev
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: WorkBuddy Manage Panel ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          body: |
            ## WorkBuddy Manage Panel ${{ inputs.release_tag || github.ref_name }}

            ### v1.14.2

            - 桌面窗口双击后直接进入管理面板，不再生成或使用临时随机登录令牌。
            - 「配置 → API 密钥」支持输入用户自己的真实密钥、生成安全随机密钥和复制。
            - `/v1/*` 始终只接受配置中非空的真实 API 密钥；桌面直达入口不能调用外部接口。
            - 独立 server 保持原有 `config.json` 鉴权语义，不启用桌面直达入口。
            - 桌面版监听端口可在「配置」中修改，仅允许本机回环地址，重启应用生效。

            ### 桌面应用

            - Linux：`.deb`（双击安装）或 `.AppImage`（赋可执行权限后双击）
            - Windows：`*-windows-amd64-setup.exe`，单用户安装，不需要管理员权限
            - macOS：通用 `.dmg` 或 `.zip`，同时支持 Intel 与 Apple Silicon

            首次运行会在下列位置创建 `config.json`、`auths/` 和 `data/`：

            - Linux：`~/.config/WorkBuddyManagePanel`
            - Windows：`%AppData%\WorkBuddyManagePanel`
            - macOS：`~/Library/Application Support/WorkBuddyManagePanel`

            关闭窗口后应用会在托盘继续运行；从托盘菜单选择“退出”才会结束网关。

            ### 未签名说明

            Windows 安装包和 macOS 应用目前未使用商业代码签名证书。Windows SmartScreen
            可能提示“未知发布者”；macOS Gatekeeper 可能阻止首次打开。所有产物均附带
            `checksums.txt`，可用 SHA-256 校验下载文件。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ inputs.release_tag || github.ref_name }}
          files: dist/*
