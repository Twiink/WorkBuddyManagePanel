version: '3'

vars:
  APP_NAME: workbuddy-manage-panel
  BIN_DIR: bin
  DESKTOP_PACKAGE: ./cmd/desktop

tasks:
  tidy:
    summary: Verify and normalize Go module metadata
    internal: true
    run: once
    cmds:
      - go mod tidy

  generate:icons:
    summary: Generate macOS and Windows icons from build/branding/appicon.png
    run: once
    sources:
      - build/branding/appicon.png
    generates:
      - build/branding/appicon.icns
      - build/branding/appicon.ico
    cmds:
      - wails3 generate icons -input build/branding/appicon.png -macfilename build/branding/appicon.icns -windowsfilename build/branding/appicon.ico

  generate:dotdesktop:
    summary: Generate the Linux desktop entry
    run: once
    sources:
      - build/linux/desktop
    generates:
      - build/linux/workbuddy-manage-panel.desktop
    cmds:
      - cp build/linux/desktop build/linux/workbuddy-manage-panel.desktop

  build:server:
    summary: Build the headless server binary
    deps: [tidy]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "{{.BIN_DIR}}/wb2api{{if eq OS \"windows\"}}.exe{{end}}" ./cmd/server
