name: go-binaries

# 测试、桌面安装包与无界面服务端产物均使用原生 runner 构建：
#   - PR / push main → 测试 + Linux/Windows/macOS 桌面安装包 + 服务端二进制
#   - push v* tag    → 同一套构建 + 汇总 checksums + 创建 GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "build/**"
      - "Taskfile.yml"
      - "config.example.json"
      - "scripts/verify_windows_resources.py"
      - "README.md"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the GitHub Release for a v* tag ref"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release source tag, for example v1.14.0 (leave empty for branch builds)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0
  APP_NAME: workbuddy-manage-panel
  MACOS_APP_NAME: WorkBuddy Manage Panel

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebView headers
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::ForceIPv4=true \
              update; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd/desktop cmd/server internal/gateway internal/buildinfo)"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

  read-version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Read build version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/buildinfo/version.go)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::cannot read Version from internal/buildinfo/version.go"
            exit 1
          fi
          PACKAGE_VERSION="${VERSION%-panel}"
          PACKAGE_VERSION="$PACKAGE_VERSION" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["PACKAGE_VERSION"]

          def check(path, actual, field):
              if actual != expected:
                  print(f"::error file={path}::{field} {actual} does not match {expected}")
                  raise RuntimeError("packaging version mismatch")

          def match(path, pattern):
              text = Path(path).read_text()
              found = re.search(pattern, text, re.MULTILINE)
              if not found:
                  print(f"::error file={path}::packaging version metadata not found")
                  raise RuntimeError("packaging version metadata not found")
              return found.group(1)

          mismatch = False
          try:
              check("build/config.yml", match("build/config.yml", r'^  version: "([0-9.]+)"$'), "info.version")
              check("build/linux/nfpm/nfpm.yaml", match("build/linux/nfpm/nfpm.yaml", r'^version: "([0-9.]+)"$'), "version")

              info = json.loads(Path("build/windows/info.json").read_text())
              check("build/windows/info.json", info["fixed"]["file_version"], "fixed.file_version")
              check("build/windows/info.json", info["info"]["0409"]["ProductVersion"], "info.0409.ProductVersion")
              check(
                  "build/windows/wails.exe.manifest",
                  match("build/windows/wails.exe.manifest", r'name="io\.github\.twiink\.workbuddy-manage-panel" version="([0-9.]+)"'),
                  "assemblyIdentity.version",
              )
              check(
                  "build/windows/nsis/wails_tools.nsh",
                  match("build/windows/nsis/wails_tools.nsh", r'^!define INFO_PRODUCTVERSION "([0-9.]+)"$'),
                  "INFO_PRODUCTVERSION",
              )

              for path in ("build/darwin/Info.plist", "build/darwin/Info.dev.plist"):
                  for field in ("CFBundleVersion", "CFBundleShortVersionString"):
                      check(
                          path,
                          match(path, rf'<key>{field}</key>\s*<string>([0-9.]+)</string>'),
                          field,
                      )
          except (KeyError, RuntimeError):
              mismatch = True
          if mismatch:
              raise SystemExit(1)
          PY
          VERSION_SCRIPT_STATUS=$?
          if [[ "$VERSION_SCRIPT_STATUS" -ne 0 ]]; then
            exit "$VERSION_SCRIPT_STATUS"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build version: $VERSION (packaging metadata: $PACKAGE_VERSION)"

  desktop-linux:
    needs: read-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native desktop dependencies
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::ForceIPv4=true \
              update; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libfuse2 python3-pil
      - name: Install Wails v3
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build .deb and AppImage
        run: |
          export PATH="${HOME}/go/bin:${PATH}"
          wails3 task linux:package
      - name: Name release files
        run: |
          V="${{ needs.read-version.outputs.version }}"
          V="${V%-panel}"
          mkdir -p release
          cp bin/workbuddy-manage-panel.deb "release/workbuddy-manage-panel_${V}_amd64.deb"
          for f in bin/*.AppImage; do
            cp "$f" "release/workbuddy-manage-panel-${V}-linux-amd64.AppImage"
          done
          test -s "release/workbuddy-manage-panel_${V}_amd64.deb"
          test -s "release/workbuddy-manage-panel-${V}-linux-amd64.AppImage"
          file release/*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release/*
          retention-days: 7

  desktop-windows:
    needs: read-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails v3 and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
          choco install nsis --yes --no-progress
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build NSIS installer
        shell: pwsh
        run: wails3 task windows:package
      - name: Verify Windows executable resources
        shell: pwsh
        run: |
          $version = "${{ needs.read-version.outputs.version }}".Replace("-panel", "")
          python scripts/verify_windows_resources.py bin/workbuddy-manage-panel.exe --version $version
      - name: Name release file
        shell: pwsh
        run: |
          $version = "${{ needs.read-version.outputs.version }}".Replace("-panel", "")
          New-Item -ItemType Directory release -Force | Out-Null
          $installer = Get-ChildItem -Path bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $output = "release\workbuddy-manage-panel-${version}-windows-amd64-setup.exe"
          Copy-Item $installer.FullName $output
          if ((Get-Item $output).Length -le 0) { throw "Empty installer: $output" }
          # In-app updater payload: the archive must hold exactly one entry,
          # the executable that replaces the installed one.
          $update = "release\workbuddy-manage-panel-${version}-windows-amd64-update.zip"
          Compress-Archive -Path bin\workbuddy-manage-panel.exe -DestinationPath $update
          if ((Get-Item $update).Length -le 0) { throw "Empty update archive: $update" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release/*
          retention-days: 7

  desktop-macos:
    needs: read-version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: go.mod
          cache: false
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails v3
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build universal .app and DMG
        run: wails3 task darwin:package
      - name: Verify macOS app metadata
        shell: bash
        run: |
          APP="bin/${MACOS_APP_NAME}.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          test -s "$APP/Contents/Resources/icons.icns"
          plutil -lint "$PLIST"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$PLIST")" = "$MACOS_APP_NAME"
          test "$(plutil -extract CFBundleName raw -o - "$PLIST")" = "$MACOS_APP_NAME"
          test "$(plutil -extract CFBundleExecutable raw -o - "$PLIST")" = "$APP_NAME"
          test "$(plutil -extract CFBundleIconFile raw -o - "$PLIST")" = "icons"
          if plutil -extract CFBundleIconName raw -o - "$PLIST" >/dev/null 2>&1; then
            echo "::error::CFBundleIconName requires Assets.car, but this bundle uses icons.icns"
            exit 1
          fi
      - name: Name release files
        run: |
          V="${{ needs.read-version.outputs.version }}"
          V="${V%-panel}"
          mkdir -p release
          DMG="bin/${MACOS_APP_NAME}.dmg"
          if [[ ! -f "$DMG" ]]; then
            echo "::error::DMG not found: $DMG"
            exit 1
          fi
          cp "$DMG" "release/workbuddy-manage-panel-${V}-macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "bin/${MACOS_APP_NAME}.app" \
            "release/workbuddy-manage-panel-${V}-macos-universal.zip"
          lipo -archs "bin/${MACOS_APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          codesign --verify --deep --strict "bin/${MACOS_APP_NAME}.app"
          test -s "release/workbuddy-manage-panel-${V}-macos-universal.dmg"
          test -s "release/workbuddy-manage-panel-${V}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release/*
          retention-days: 7

  server-binaries:
    needs: read-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: zip }
          - { goos: linux, goarch: amd64, ext: tar.gz }
          - { goos: linux, goarch: arm64, ext: tar.gz }
          - { goos: darwin, goarch: amd64, ext: tar.gz }
          - { goos: darwin, goarch: arm64, ext: tar.gz }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package server
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          BIN="wb2api"
          [[ "$GOOS" == windows ]] && BIN+=".exe"
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$BIN" ./cmd/server
          VERSION="${VERSION%-panel}"
          grep -aq "$VERSION" "$BIN"
          NAME="wb2api-panel-${VERSION}-${GOOS}-${GOARCH}.${{ matrix.ext }}"
          if [[ "$GOOS" == windows ]]; then
            zip -q "$NAME" "$BIN" config.example.json README.md
          else
            tar czf "$NAME" "$BIN" config.example.json README.md
          fi
          mkdir -p release
          mv "$NAME" release/
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          retention-days: 7

  publish:
    needs:
      - read-version
      - desktop-linux
      - desktop-windows
      - desktop-macos
      - server-binaries
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish &&
        (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag matches source version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          SRC="${{ needs.read-version.outputs.version }}"
          SRC="${SRC%-panel}"
          TAG="$RELEASE_TAG"
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          if [[ "$TAG" != *-ci ]]; then
            TAG="${TAG#v}"
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $RELEASE_TAG does not match source version $SRC"
              exit 1
            fi
          else
            echo "CI-only tag $RELEASE_TAG skips the release-version assertion"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify desktop package metadata
        shell: bash
        run: |
          V="${{ needs.read-version.outputs.version }}"
          V="${V%-panel}"
          test "$(dpkg-deb -f "dist/workbuddy-manage-panel_${V}_amd64.deb" Version)" = "${V}-1"
          dpkg-deb -f "dist/workbuddy-manage-panel_${V}_amd64.deb" Depends | grep -qw pkexec
          unzip -p "dist/workbuddy-manage-panel-${V}-macos-universal.zip" \
            "WorkBuddy Manage Panel.app/Contents/Info.plist" > /tmp/Info.plist
          test "$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' /tmp/Info.plist)" = "$V"
          test "$(sed -n '/<key>CFBundleDisplayName<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' /tmp/Info.plist)" = "WorkBuddy Manage Panel"
          test "$(sed -n '/<key>CFBundleIconFile<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' /tmp/Info.plist)" = "icons"
          if grep -q '<key>CFBundleIconName</key>' /tmp/Info.plist; then
            echo "::error::CFBundleIconName requires Assets.car"
            exit 1
          fi
      - name: Verify expected assets
        shell: bash
        run: |
          count_deb="$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)"
          count_appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          count_windows="$(find dist -maxdepth 1 -type f -name '*-windows-amd64-setup.exe' | wc -l)"
          count_windows_update="$(find dist -maxdepth 1 -type f -name '*-windows-amd64-update.zip' | wc -l)"
          count_dmg="$(find dist -maxdepth 1 -type f -name '*-macos-universal.dmg' | wc -l)"
          count_macos_zip="$(find dist -maxdepth 1 -type f -name '*-macos-universal.zip' | wc -l)"
          if (( count_deb != 1 || count_appimage != 1 || count_windows != 1 || count_windows_update != 1 || count_dmg != 1 || count_macos_zip != 1 )); then
            find dist -maxdepth 1 -type f -printf '%f\n' | sort
            echo "::error::desktop release assets are incomplete"
            exit 1
          fi
      - name: Create checksums
        run: |
          cd dist
          mapfile -t assets < <(
            find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' |
              sort
          )
          printf 'Created checksums.txt\n'
          sha256sum "${assets[@]}" | tee checksums.txt
          sha256sum --check checksums.txt
      - name: Find previous release tag
        id: prev
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: WorkBuddy Manage Panel ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          body: |
            ## WorkBuddy Manage Panel ${{ inputs.release_tag || github.ref_name }}

            ### ${{ inputs.release_tag || github.ref_name }}

            - 桌面版监听端口被占用时自动改用可用的本机回环端口，保证应用继续启动；窗口标题、面板顶部和配置页会明确显示配置端口与实际端口，且不会改写 `config.json`。
            - `.deb` 版本支持应用内更新：下载并校验新包后通过 Polkit 请求管理员授权，使用 `apt-get` 完成安装，并可选择立即重启。
            - 修正 macOS 应用包名称、版本与图标元数据，改善安装后的显示和更新识别。

            ### 桌面应用

            - Linux：`.deb`（双击安装）或 `.AppImage`（赋可执行权限后双击）
            - Windows：`*-windows-amd64-setup.exe`，单用户安装，不需要管理员权限
            - macOS：通用 `.dmg` 或 `.zip`，同时支持 Intel 与 Apple Silicon

            首次运行会在下列位置创建 `config.json`、`auths/` 和 `data/`：

            - Linux：`~/.config/WorkBuddyManagePanel`
            - Windows：`%AppData%\WorkBuddyManagePanel`
            - macOS：`~/Library/Application Support/WorkBuddyManagePanel`

            关闭窗口后应用会在托盘继续运行；从托盘菜单选择“退出”才会结束网关。

            ### 应用内更新

            桌面应用启动后会检查 GitHub Releases 上的新版本，也可在托盘菜单选择“检查更新…”。
            Windows、macOS 和 AppImage 下载后先用 `checksums.txt` 校验 SHA-256，再重启替换；
            `.deb` 安装只提示并打开下载页面。`*-windows-amd64-update.zip` 供应用内更新使用，
            首次安装请用 `setup.exe`。

            ### 未签名说明

            Windows 安装包和 macOS 应用目前未使用商业代码签名证书。Windows SmartScreen
            可能提示“未知发布者”；macOS Gatekeeper 可能阻止首次打开。所有产物均附带
            `checksums.txt`，可用 SHA-256 校验下载文件。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ inputs.release_tag || github.ref_name }}
          files: dist/*
